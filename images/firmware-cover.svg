<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Firmware and IoT: sensor to firmware to gateway to cloud analytics">
  <defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1620"/><stop offset="1" stop-color="#16293a"/></linearGradient></defs>
  <rect width="1200" height="630" fill="url(#fg)"/>

  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
    <text x="100" y="92" font-size="54" font-weight="700" fill="#eef6fc" letter-spacing="-1.4">Firmware &amp; IoT</text>
    <text x="100" y="132" font-size="22" fill="#7fa8c6">From the instrument to the cloud</text>
  </g>
  <line x1="100" y1="164" x2="1100" y2="164" stroke="#39597a" stroke-width="1" opacity=".55"/>

  <g fill="none" stroke="#6ea3cc" stroke-width="1.7" stroke-linecap="round">
    <rect x="140" y="316" width="200" height="84" rx="12"/>
    <rect x="380" y="316" width="200" height="84" rx="12"/>
    <rect x="620" y="316" width="200" height="84" rx="12"/>
    <rect x="860" y="316" width="200" height="84" rx="12"/>
    <path d="M340 358 H380"/><path d="M580 358 H620"/><path d="M820 358 H860"/>
  </g>
  <g fill="#6ea3cc">
    <path d="M372 358 l-11 -6 v12 z"/><path d="M612 358 l-11 -6 v12 z"/><path d="M852 358 l-11 -6 v12 z"/>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" fill="#d5e8f6" text-anchor="middle">
    <text x="240" y="365">instrument</text>
    <text x="480" y="365">firmware</text>
    <text x="720" y="365">gateway</text>
    <text x="960" y="365">analytics</text>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#5b87ab" text-anchor="middle">
    <text x="480" y="440">real-time control</text>
    <text x="720" y="440">telemetry</text>
    <text x="960" y="440">monitoring</text>
  </g>

  <text x="100" y="572" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" fill="#5b87ab">laboratory equipment  ·  IoT devices  ·  machinery coordination</text>
</svg>
